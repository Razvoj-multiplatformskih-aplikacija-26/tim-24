services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hedrion
      POSTGRES_USER: hedrion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    ports: ["127.0.0.1:${POSTGRES_PORT:-55432}:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hedrion -d hedrion"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
