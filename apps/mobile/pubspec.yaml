name: hedrion_mobile
description: Hedrion creator studio for Android and web.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  domain: any
  blocs: any
  flutter_bloc: ^9.1.1
  go_router: ^18.1.1
  image_picker: ^1.2.4
  file_selector: ^1.1.0
  hedrion_api_client: any
  sqflite: ^2.4.5
  flutter_secure_storage: ^11.2.0
  share_plus: ^13.3.1

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
